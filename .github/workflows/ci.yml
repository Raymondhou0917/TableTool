name: Build and test
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test English and Traditional Chinese
        run: bash scripts/test.sh
      - name: Build Apple Silicon archive
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results-and-arm64-build
          path: |
            build/Tests-*.xcresult
            dist/*.zip
